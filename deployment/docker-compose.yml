version: "3.8"

services:
  sat-sa:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: sat-sa-platform
    ports:
      - "8000:8000"
    volumes:
      - sat-sa-data:/app/data
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:////app/data/sat_sa.db
      - DEBUG=False

volumes:
  sat-sa-data:
    driver: local
